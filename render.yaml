services:
  # ==========================================
  # 1. AICTE Backend Express API (Web Service)
  # ==========================================
  - type: web
    name: aicte-portal-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 60m
      - key: FRONTEND_URL
        fromService:
          type: web
          name: aicte-portal-frontend
          property: url

  # ==========================================
  # 2. AICTE Frontend React Vite (Static Site)
  # ==========================================
  - type: web
    env: static
    name: aicte-portal-frontend
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: aicte-portal-backend
          property: url
