services:
  # ========================================================
  # AICTE Smart Approval Portal - Unified Full-Stack Service
  # Serves both the React Frontend (Vite) and Express Backend
  # on a single URL with zero CORS or API configuration issues.
  # ========================================================
  - type: web
    name: aicte-smart-portal
    env: node
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && npm install && npx prisma generate
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 60m
